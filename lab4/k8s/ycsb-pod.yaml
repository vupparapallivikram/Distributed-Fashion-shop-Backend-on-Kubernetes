apiVersion: v1
kind: Pod
metadata:
  name: ycsb
  namespace: team8
spec:
  restartPolicy: Never
  containers:
  - name: ycsb
    image: golang:1.21
    command:
      - "/bin/bash"
      - "-c"
      - |
        apt-get update && apt-get install -y git make gcc postgresql-client &&
        git clone https://github.com/pingcap/go-ycsb.git /go-ycsb &&
        cd /go-ycsb && make &&
        echo "go-ycsb ready!" &&
        sleep infinity
    resources:
      requests:
        cpu: "500m"
        memory: "2Gi"
      limits:
        cpu: "500m"
        memory: "2Gi"
