apiVersion: v1
kind: Service
metadata:
  name: cockroachdb-lab4
  labels:
    app: cockroachdb-lab4
spec:
  ports:
  - port: 26257
    targetPort: 26257
    name: grpc
  - port: 8080
    targetPort: 8080
    name: http
  clusterIP: None
  selector:
    app: cockroachdb-lab4
---
apiVersion: v1
kind: Service
metadata:
  name: cockroachdb-lab4-public
  labels:
    app: cockroachdb-lab4
spec:
  ports:
  - port: 26257
    targetPort: 26257
    name: grpc
  - port: 8080
    targetPort: 8080
    name: http
  selector:
    app: cockroachdb-lab4
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: cockroachdb-lab4
spec:
  serviceName: cockroachdb-lab4
  replicas: 4
  selector:
    matchLabels:
      app: cockroachdb-lab4
  template:
    metadata:
      labels:
        app: cockroachdb-lab4
    spec:
      initContainers:
      - name: fix-permissions
        image: busybox
        command: ["sh", "-c", "chown -R 1000:1000 /cockroach/cockroach-data"]
        volumeMounts:
        - name: datadir
          mountPath: /cockroach/cockroach-data
        resources:
          requests:
            memory: "64Mi"
            cpu: "100m"
          limits:
            memory: "64Mi"
            cpu: "100m"
      containers:
      - name: cockroachdb
        image: cockroachdb/cockroach:v23.1.11
        ports:
        - containerPort: 26257
          name: grpc
        - containerPort: 8080
          name: http
        # Lab 4 requirements: CPU=4, Memory=8Gi
        resources:
          requests:
            memory: "8Gi"
            cpu: "4"
          limits:
            memory: "8Gi"
            cpu: "4"
        command:
          - "/bin/bash"
          - "-ecx"
          - |
            # No locality labels for Lab 4 (no geo-replication)
            exec /cockroach/cockroach start \
            --logtostderr \
            --insecure \
            --advertise-host $(hostname -f) \
            --http-addr 0.0.0.0 \
            --join cockroachdb-lab4-0.cockroachdb-lab4,cockroachdb-lab4-1.cockroachdb-lab4,cockroachdb-lab4-2.cockroachdb-lab4 \
            --cache 25% \
            --max-sql-memory 25%
        volumeMounts:
        - name: datadir
          mountPath: /cockroach/cockroach-data
  volumeClaimTemplates:
  - metadata:
      name: datadir
    spec:
      accessModes:
        - ReadWriteOnce
      storageClassName: ceph-hdd
      resources:
        requests:
          storage: 25Gi   # Lab 4 requirement: 25 GB
