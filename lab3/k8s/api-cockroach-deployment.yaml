apiVersion: apps/v1
kind: Deployment
metadata:
  name: ddis-api-cockroach
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ddis-api-cockroach
  template:
    metadata:
      labels:
        app: ddis-api-cockroach
    spec:
      containers:
        - name: ddis-api
          image: rakeshreddykalamakuntla/ddis-api:v20
          ports:
            - containerPort: 8000
          resources:
            requests:
              memory: "512Mi"
              cpu: "500m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          env:
            - name: DB_HOST
              value: "cockroachdb-public"
            - name: DB_NAME
              value: "fashion_shop"
            - name: DB_USER
              value: "vikram"
            - name: DB_PASS
              value: ""
            - name: DB_PORT
              value: "26257"
---
apiVersion: v1
kind: Service
metadata:
  name: ddis-api-cockroach-service
spec:
  selector:
    app: ddis-api-cockroach
  ports:
    - port: 80
      targetPort: 8000
  type: ClusterIP
