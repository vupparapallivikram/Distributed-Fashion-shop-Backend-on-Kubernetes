apiVersion: v1
kind: Pod
metadata:
  name: loadtest
  namespace: team8
spec:
  restartPolicy: Never
  containers:
  - name: loadtest
    image: locustio/locust:2.15.1
    command: ["sleep", "3600"]
    resources:
      requests:
        cpu: "200m"
        memory: "512Mi"
      limits:
        cpu: "200m"
        memory: "512Mi"
